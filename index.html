<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Static dark background -->
    <div class="background-container"></div>

    <!-- Hero Section Content -->
    <section class="hero-section">
        <img src="logo.png" alt="IA Academy Logo" class="logo">
        <h1>Devenez expert en IA Generative!</h1>
        <p>Bientôt disponible!</p>
        
        <!-- Flip-style Countdown -->
        <div class="countdown-container">
            <!-- Days -->
            <div class="countdown-block">
                <div class="flip-card">
                    <span id="days" class="digit">00</span>
                </div>
                <div class="countdown-label">JOURS</div>
            </div>
            
            <!-- Hours -->
            <div class="countdown-block">
                <div class="flip-card">
                    <span id="hours" class="digit">00</span>
                </div>
                <div class="countdown-label">HEURES</div>
            </div>
            
            <!-- Minutes -->
            <div class="countdown-block">
                <div class="flip-card">
                    <span id="minutes" class="digit">00</span>
                </div>
                <div class="countdown-label">MINUTES</div>
            </div>
            
            <!-- Seconds -->
            <div class="countdown-block">
                <div class="flip-card">
                    <span id="seconds" class="digit">00</span>
                </div>
                <div class="countdown-label">SECONDES</div>
            </div>
        </div>
        
       
    </section>

    <!-- JavaScript -->
    <script src="scripts.js"></script>
</body>
</html>
